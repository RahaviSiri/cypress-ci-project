<!DOCTYPE html>
<html>
<body>
  <h2>Login</h2>

  <input id="username" placeholder="Username" />
  <input id="password" type="password" />
  <button onclick="login()">Login</button>

  <p id="message"></p>

  <script>
    function login() {
      const u = username.value;
      const p = password.value;

      if (u === "admin" && p === "1234") {
        message.innerText = "Success";
      } else {
        message.innerText = "Fail";
      }
    }
  </script>
</body>
</html>
